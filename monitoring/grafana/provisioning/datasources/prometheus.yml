apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned, not left to Grafana. Without an explicit uid Grafana generates one
    # (PBFA97CFB590B2093 or similar), and monitoring/grafana/dashboards/algostream.json references
    # its datasource by uid — so every panel silently fails to resolve and the dashboard renders
    # empty with no error to explain why.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
