# Prometheus scrape configuration for AlgoStream.
#
# The exporter is /metrics on the dashboard API, gated on the `read` scope like every other
# observation endpoint — so a bearer token is required. That is deliberate: /metrics carries the
# same telemetry the dashboard shows, and leaving it open would make it the one unauthenticated
# hole in an otherwise authenticated surface.
#
# Point `bearer_token_file` at a file containing a read-scoped key with no trailing newline:
#
#   algostream-keyctl add --label prometheus --scopes read | awk '/^key:/{printf "%s", $2}' > prom.key
#   chmod 600 prom.key

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: algostream

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: algostream
    metrics_path: /metrics
    # The daemon rebuilds the snapshot on demand, which costs a few microseconds; 15s is far more
    # often than anything here changes meaningfully and still catches a stall quickly.
    scrape_interval: 15s
    scrape_timeout: 10s
    bearer_token_file: /etc/prometheus/algostream.key
    static_configs:
      - targets: ['algostream:8080']
        labels:
          instance: algostream-primary

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
