# ───── Group ordering on the index page ────────────────────────────

[_groups]
order = ["Foundations", "Market Data", "Strategy", "Research", "Operations"]

[_groups.blurb]
"Foundations" = "Getting a build running, writing a strategy, and the event bus and domain types underneath."
"Market Data" = "Live feeds in, normalized bars and statistics out."
"Strategy"    = "Cointegration, models, order routing and risk control."
"Research"    = "Backtesting, Monte Carlo simulation, performance measurement and parameter search."
"Operations"  = "Running it, watching it, securing it, and knowing what to do when it breaks."
