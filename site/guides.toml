# ═══════════════════════════════════════════════════════════════════
# Presentation metadata for the generated documentation pages.
#
# One table per file in docs/guides/, keyed by its stem. Kept here
# rather than as front matter in the markdown, because front matter
# renders as junk when the guides are read on GitHub.
#
# scripts/gen-guides.py fails if a guide on disk has no entry here, and
# fails if an entry has no matching guide. That is deliberate: it is what
# stops a new guide being silently dropped from the index.
#
# Required: nav_label, group, order.
# Optional: h1, accent, phase, status, meta, footer.
#   h1      display title; defaults to the markdown H1 with a trailing
#           "Guide" stripped
#   accent  the substring of h1 rendered in amber; defaults to the last word
#   meta    chips under the title. A "source" chip linking to the markdown
#           on GitHub is appended automatically.
#   footer  lines for the ASCII block in the page footer
# ═══════════════════════════════════════════════════════════════════

