<!-- Replaces the `flowchart LR` in docs/guides/live_runtime.md.

     API domain as the reader rather than a strategy domain. -->
<div class="diagram">

  <div class="diagram-body">
    <svg viewBox="0 0 900 268" role="img"

        <marker id="ah-lr1" viewBox="0 0 8 8" refX="7.5" refY="4"

      </defs>

      <rect class="d-group" x="8" y="44" width="200" height="206" rx="2"/>
      <text class="d-glabel" x="20" y="36">Bus Dispatcher Domain</text>
      <rect class="d-node" x="24" y="116" width="168" height="48" rx="2"/>
      <text class="d-title" x="40" y="145">Dispatcher loop</text>

      <rect class="d-group" x="328" y="44" width="270" height="206" rx="2"/>
      <text class="d-glabel" x="340" y="36">Runtime Domain</text>
      <rect class="d-node" x="344" y="66" width="238" height="42" rx="2"/>

      <rect class="d-node-a" x="344" y="132" width="238" height="100" rx="2"/>

      <text class="d-title" x="360" y="175">portfolio · fill engine</text>

      <text class="d-title" x="360" y="211">Strategy.S</text>

      <rect class="d-group" x="698" y="44" width="194" height="206" rx="2"/>

      <rect class="d-node" x="714" y="116" width="162" height="48" rx="2"/>

</div>
